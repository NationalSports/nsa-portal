<!doctype html><html lang="en"><meta charset="utf-8"><title>Draft recovery browser verification</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px}button{padding:10px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:#f1f5f9;padding:20px}</style>
<h1>Draft recovery browser verification</h1><p>Uses synthetic documents in an isolated local browser database. No ERP requests are sent.</p>
<button id="run">Run browser checks</button><button id="reload">Reload and verify recovery</button><pre id="result">Ready</pre>
<script type="module">
import {createDraftJournal} from '../../src/lib/draftJournal.js';
const output=document.querySelector('#result');
const name=sessionStorage.getItem('draft-check-db')||'draft-check-'+Date.now();sessionStorage.setItem('draft-check-db',name);
const a=createDraftJournal({name,session:'browser-a'}),b=createDraftJournal({name,session:'browser-b'});
const assert=(ok,label)=>{if(!ok)throw new Error(label);output.textContent+='\nPASS '+label;};
document.querySelector('#run').onclick=async()=>{
 output.textContent='Running native IndexedDB checks';
 try{
 const source={id:'SO-SYNTHETIC',memo:'draft A'};
 const pending=a.stage('test-owner','sales_orders',source);source.memo='later mutation';const old=await pending;
 assert((await a.list('test-owner'))[0].payload.memo==='draft A','immutable capture');
 const latest=await a.stage('test-owner','sales_orders',{id:'SO-SYNTHETIC',memo:'draft A newer'});
 const other=await b.stage('test-owner','sales_orders',{id:'SO-SYNTHETIC',memo:'draft B'});
 assert((await a.list('test-owner')).length===2,'independent connections preserve both drafts');
 assert(await b.acknowledge(old)===false,'late response cannot clear newer draft');
 assert(await a.update(old,{id:'SO-SYNTHETIC',memo:'late failed write'})===false,'late failure cannot overwrite newer draft');
 await a.acknowledge(latest);
 assert((await b.list('test-owner'))[0].revision===other.revision,'acknowledgement clears only its own revision');
 assert((await b.list('different-owner')).length===0,'recovery list is scoped to its owner');
 sessionStorage.setItem('draft-check-revision',other.revision);
 output.textContent+='\nReady for reload verification';
 }catch(error){output.textContent+='\nFAIL '+error.message;}
};
document.querySelector('#reload').onclick=()=>location.reload();
const expected=sessionStorage.getItem('draft-check-revision');
if(expected){try{const rows=await a.list('test-owner');assert(rows.some(r=>r.revision===expected&&r.payload.memo==='draft B'),'draft survives page reload');}catch(error){output.textContent='FAIL '+error.message;}}
</script></html>
